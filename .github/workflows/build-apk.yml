
name: Build NAYA Master APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - 'NAYA-MASTER-PROJECT.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Check Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -d "$ANDROID_HOME"
          echo "Android SDK found"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Extract NAYA Master Project
        run: |
          test -f NAYA-MASTER-PROJECT.zip
          mkdir -p _src
          unzip -q NAYA-MASTER-PROJECT.zip -d _src

      - name: Locate Android project
        id: project
        run: |
          SETTINGS=$(find _src -type f \( \
            -name settings.gradle.kts -o \
            -name settings.gradle \
          \) -print -quit)

          if [ -z "$SETTINGS" ]; then
            echo "Gradle settings file not found"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          if [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ] && \
             [ ! -f "$PROJECT_DIR/app/build.gradle" ]; then
            echo "Android app module not found"
            exit 1
          fi

          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Project found: $PROJECT_DIR"

      - name: Build NAYA Debug APK
        working-directory: ${{ steps.project.outputs.dir }}
        run: |
          gradle assembleDebug --stacktrace

      - name: Upload NAYA APK
        uses: actions/upload-artifact@v4
        with:
          name: NAYA-MASTER-APK
          path: ${{ steps.project.outputs.dir }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
          
